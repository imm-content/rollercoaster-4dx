<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가상 롤러코스터 4DX 시네마</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132b30 url('assets/backgrounds/rollercoaster-background.png') center center / cover no-repeat fixed;color:#fff;font-family:'Malgun Gothic',system-ui,sans-serif}canvas{display:block}#ui{position:absolute;inset:0;pointer-events:none}header{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;text-shadow:0 2px 8px #000}h1{font-size:clamp(18px,3vw,28px);margin:0 0 6px}header small{color:#d3e9ff}.pill{background:#071c38cc;border:1px solid #6aa4d780;border-radius:22px;padding:9px 13px;font-weight:bold}.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px;width:min(96%,900px);padding:12px;background:#06152cdb;border:1px solid #5684b680;border-radius:16px;pointer-events:auto;backdrop-filter:blur(10px)}button,select{border:1px solid #70a3d6;background:#16385c;color:#fff;padding:11px 14px;border-radius:10px;font-size:14px;cursor:pointer}button.primary{background:#1682d4;border-color:#55b4ff;font-weight:bold}button:focus-visible,select:focus-visible{outline:3px solid #fff}label{font-size:13px;display:flex;align-items:center;gap:6px}.status{position:absolute;top:95px;left:18px;padding:10px 14px;background:#071c38bb;border-radius:10px;line-height:1.8;font-size:14px}.notice{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:min(90vw,500px);width:100%;padding:24px;background:#07182de8;border:1px solid #82b5ec;border-radius:18px;text-align:center;pointer-events:auto;box-shadow:0 15px 50px #0008}.notice h2{margin:0 0 10px}.notice p{line-height:1.7;color:#d8eaff}.notice button{margin-top:10px}.hidden{display:none}#progress{position:absolute;bottom:0;left:0;height:5px;background:#43c9ff;width:0;transition:width .15s}#message{position:absolute;top:21%;width:100%;text-align:center;font-size:clamp(18px,3vw,32px);font-weight:bold;text-shadow:0 3px 12px #000;pointer-events:none}@media(max-width:600px){.controls{bottom:12px;padding:8px;gap:5px}.controls button,.controls select{padding:9px 10px;font-size:12px}.status{top:85px;font-size:12px}header .pill{font-size:12px}}
</style>
</head>
<body>
<div id="ui"><header><div><h1>🎢 가상 롤러코스터 4DX 시네마</h1><small>1인칭 3D · 사진형 배경 · 급강하 · 루프 · 터널</small></div><div class="pill" id="speed">0 km/h</div></header><div class="status"><div id="stage">대기 중</div><div id="distance">진행률 0%</div></div><div id="message"></div><div class="controls"><button id="start" class="primary">▶ 탑승 시작</button><button id="pause" disabled>⏸ 일시정지</button><button id="restart">↻ 처음부터</button><label>체험 강도 <select id="intensity"><option value="easy">완만</option><option value="normal" selected>보통</option><option value="hard">스릴</option></select></label><label><input id="shake" type="checkbox" checked> 화면 흔들림</label><label><input id="sound" type="checkbox" checked> 소리</label></div><div id="progress"></div><div class="notice" id="notice"><h2>🎢 롤러코스터 탑승 안내</h2><p>높은 철로를 올라 급강하하고, 360도 수직 루프와 터널을 통과합니다.<br>어지럼증이 있다면 <b>완만</b> 모드를 선택하고 화면 흔들림을 끄세요.</p><p>※ 배경은 실제 현장 촬영 사진이 아닌 생성 이미지입니다. 카메라 이동에 따른 배경 시차는 지원하지 않습니다. 실제 좌석·바람·물 분사 기능은 제공하지 않습니다.</p><button id="enter" class="primary">체험 시작</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene(); // 실제 사진이 아닌 생성 배경을 HTML 배경 레이어로 표시
const camera=new THREE.PerspectiveCamera(77,innerWidth/innerHeight,0.08,2200);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0x000000,0);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf7ff,0x52683b,2.0));const sun=new THREE.DirectionalLight(0xfff5db,2.2);sun.position.set(-120,220,80);scene.add(sun);
const mat=(color,roughness=0.7)=>new THREE.MeshStandardMaterial({color,roughness});const grass=mat(0x438c4b),railMat=mat(0xf1b52b,0.35),steel=mat(0x56677b),tieMat=mat(0x313e4c),treeGreen=[mat(0x246f43),mat(0x31844a),mat(0x4b9650)];
// 인위적인 초록색 평면을 제거해 사진 배경을 가리지 않음.
// 구간별 높이와 진행 방향을 설계한 경로. 루프는 X-Y 평면의 원형 경로로 생성.
const pts=[];function P(x,y,z){pts.push(new THREE.Vector3(x,y,z))}
P(0,8,80);P(0,9,40);P(0,15,0);P(0,32,-40);P(0,58,-85);P(0,86,-130);P(0,92,-165);P(0,90,-190);P(0,74,-220);P(0,45,-250);P(0,17,-285);P(0,12,-315);
// 정면으로 진행하는 루프: 시작/끝 위치를 연결하면서 수직 원을 한 바퀴 돎
const cx=0,cy=30,cz=-349,r=21;P(0,9,-333);
for(let i=1;i<=44;i++){const a=-Math.PI/2+i*Math.PI*2/44;P(cx+r*Math.cos(a),cy+r*Math.sin(a),cz)}
P(0,9,-374);P(0,11,-415);P(35,13,-455);P(90,18,-470);P(145,15,-445);P(160,12,-395);P(140,11,-340);P(95,10,-305);P(60,9,-255);P(70,10,-205);P(120,12,-160);P(160,12,-115);P(150,10,-60);P(110,9,-15);P(55,8,35);P(0,8,80);
const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');const total=curve.getLength();const railOffset=0.85;
// 카메라 상단 방향은 진행 접선에 따라 달라져 루프에서 자연스럽게 뒤집힘.
function basis(t){const tangent=curve.getTangentAt(t).normalize();let right=new THREE.Vector3().crossVectors(tangent,new THREE.Vector3(0,1,0));if(right.lengthSq()<0.001)right.set(1,0,0);right.normalize();let up=new THREE.Vector3().crossVectors(right,tangent).normalize();return {tangent,right,up}}
function offsetPath(dx,dy){const arr=[];for(let i=0;i<=950;i++){const t=i/950,p=curve.getPointAt(t),b=basis(t);arr.push(p.addScaledVector(b.right,dx).addScaledVector(b.up,dy))}return new THREE.CatmullRomCurve3(arr,false,'centripetal')}
for(const dx of [-railOffset,railOffset]){const mesh=new THREE.Mesh(new THREE.TubeGeometry(offsetPath(dx,0),1050,0.15,6,false),railMat);scene.add(mesh)}
const beamGeo=new THREE.BoxGeometry(2.5,.24,.55),beam=new THREE.InstancedMesh(beamGeo,tieMat,320),dummy=new THREE.Object3D();for(let i=0;i<320;i++){const t=i/320,p=curve.getPointAt(t),b=basis(t);dummy.position.copy(p).addScaledVector(b.up,-.2);const m=new THREE.Matrix4().makeBasis(b.right,b.up,b.tangent);dummy.quaternion.setFromRotationMatrix(m);dummy.updateMatrix();beam.setMatrixAt(i,dummy.matrix)}beam.instanceMatrix.needsUpdate=true;scene.add(beam);
// 받침 기둥
const supportGeo=new THREE.CylinderGeometry(.23,.36,1,7),supports=new THREE.InstancedMesh(supportGeo,steel,115);let count=0;for(let i=0;i<115;i++){const p=curve.getPointAt(i/115);if(p.y<3)continue;dummy.position.set(p.x,(p.y-2)/2-2,p.z);dummy.quaternion.identity();dummy.scale.set(1,Math.max(1,p.y),1);dummy.updateMatrix();supports.setMatrixAt(count++,dummy.matrix)}supports.count=count;supports.instanceMatrix.needsUpdate=true;scene.add(supports);
// 기존 원뿔형 나무 및 가짜 건물 배경 제거.
// assets/backgrounds/rollercoaster-background.png를 화면 전체에 표시.
// 터널: 진행 구간 주변에 반복되는 아치형 고리
const tunnelGroup=new THREE.Group();scene.add(tunnelGroup);const tunnelStart=.62,tunnelEnd=.70;for(let i=0;i<26;i++){const t=tunnelStart+(tunnelEnd-tunnelStart)*i/25,p=curve.getPointAt(t),b=basis(t);const ring=new THREE.Mesh(new THREE.TorusGeometry(5.2,.38,7,16),mat(i%2?0x00d9ff:0x974aff,.3));ring.position.copy(p);ring.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(b.right,b.up,b.tangent));tunnelGroup.add(ring)}
// 차량 앞쪽 일부를 카메라에 고정해 1인칭 탑승감을 부여
const cart=new THREE.Group();camera.add(cart);scene.add(camera);const hood=new THREE.Mesh(new THREE.BoxGeometry(2.15,.55,2.0),mat(0xdd304a,.35));hood.position.set(0,-1.12,-2.3);cart.add(hood);const bar=new THREE.Mesh(new THREE.TorusGeometry(.75,.08,7,16,Math.PI),steel);bar.position.set(0,-.75,-1.2);bar.rotation.z=Math.PI;cart.add(bar);
const $=id=>document.getElementById(id);let state='idle',progress=0,last=performance.now(),audioCtx=null,osc=null,noiseGain=null,stageLast='';const stageNames=['1막 · 출발','2막 · 고공 상승','3막 · 급강하','4막 · 360° 수직 루프','5막 · 터널과 급회전','6막 · 도착'];
function stageAt(t){if(t<.11)return 0;if(t<.27)return 1;if(t<.39)return 2;if(t<.54)return 3;if(t<.86)return 4;return 5}
function soundStart(){if(!$('sound').checked)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();if(osc)return;osc=audioCtx.createOscillator();noiseGain=audioCtx.createGain();osc.type='sawtooth';osc.frequency.value=55;noiseGain.gain.value=.014;osc.connect(noiseGain).connect(audioCtx.destination);osc.start()}catch(e){console.warn('오디오 사용 불가',e)}}
function soundStop(){if(osc){osc.stop();osc.disconnect();osc=null}if(noiseGain){noiseGain.disconnect();noiseGain=null}}
function updateButtons(){$('pause').disabled=state!=='running'&&state!=='paused';$('pause').textContent=state==='paused'?'▶ 계속':'⏸ 일시정지';$('start').disabled=state==='running'||state==='paused';$('start').textContent=state==='done'?'▶ 다시 탑승':'▶ 탑승 시작'}
function start(){if(state==='running')return;if(state==='done')progress=0;state='running';$('notice').classList.add('hidden');soundStart();updateButtons()}
function restart(){progress=0;state='idle';soundStop();$('notice').classList.remove('hidden');$('message').textContent='';updateButtons();renderPosition(0,0)}
$('start').onclick=start;$('enter').onclick=start;$('restart').onclick=restart;$('pause').onclick=()=>{if(state==='running'){state='paused';soundStop()}else if(state==='paused'){state='running';soundStart()}updateButtons()};$('sound').onchange=()=>{if(!$('sound').checked)soundStop();else if(state==='running')soundStart()};
function renderPosition(t,elapsed){const p=curve.getPointAt(t),b=basis(t);const intensity=$('intensity').value;const strength=intensity==='easy'?.12:intensity==='hard'?.85:.38;const shake=state==='running'&&$('shake').checked?strength:0;const wobble=new THREE.Vector3(Math.sin(elapsed*31)*shake*.07,Math.sin(elapsed*43)*shake*.05,0);camera.position.copy(p).addScaledVector(b.up,1.05).add(wobble);const m=new THREE.Matrix4().makeBasis(b.right,b.up,b.tangent.clone().negate());camera.quaternion.setFromRotationMatrix(m); // 카메라의 -Z 축을 진행 방향으로 정렬
camera.rotateZ(Math.sin(elapsed*2.3)*shake*.018);const stage=stageAt(t);$('stage').textContent=stageNames[stage];$('distance').textContent='진행률 '+Math.round(t*100)+'%';$('progress').style.width=(t*100)+'%';$('speed').textContent=(state==='running'?Math.round((.017+Math.max(0,Math.sin(t*28))*.015)*total*3.6):0)+' km/h';if(stageNames[stage]!==stageLast){stageLast=stageNames[stage];$('message').textContent=stageNames[stage];setTimeout(()=>{if($('message').textContent===stageNames[stage])$('message').textContent=''},1800)}}
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(state==='running'){const t=progress;const intensity=$('intensity').value;const multiplier=intensity==='easy'?.7:intensity==='hard'?1.32:1;const base=t<.27?.009:t<.43?.026:t<.56?.018:t<.85?.023:.012;progress=Math.min(1,progress+dt*base*multiplier);if(noiseGain&&osc){osc.frequency.value=48+progress*50+Math.sin(now*.012)*5;noiseGain.gain.value=.01+base*.35}if(progress>=1){state='done';soundStop();$('message').textContent='🎉 무사히 도착했습니다!';updateButtons()}}renderPosition(progress,now/1000);renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateButtons();requestAnimationFrame(animate);
</script>
</body></html>
